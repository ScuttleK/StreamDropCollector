name: Release Build
on:
    push:
        tags: ["v*"]
jobs:
    build:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Publish (Self-Contained)
              run: |
                  Remove-Item -Recurse -Force publish/self-contained/ -ErrorAction SilentlyContinue
                  dotnet publish UI/UI.csproj -c Release -r win-x64 -p:SelfContained=true -o publish/self-contained/

            - name: Publish (Framework-Dependent)
              run: |
                  Remove-Item -Recurse -Force publish/framework-dependent/ -ErrorAction SilentlyContinue
                  dotnet publish UI/UI.csproj -c Release -r win-x64 -p:SelfContained=false -o publish/framework-dependent/

            - name: Build Installer (Inno Setup)
              shell: pwsh
              run: |
                  choco install innosetup -y --no-progress
                  $version = "${{ github.ref_name }}" -replace '^v', ''
                  & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "Installer\StreamDropCollector.iss" "/DMyAppVersion=$version"
                  Copy-Item "publish\installer\StreamDropCollectorSetup-$version.exe" "StreamDropCollector-${{ github.ref_name }}-setup.exe"
                  Copy-Item "publish\installer\StreamDropCollectorSetup-$version.exe" "StreamDropCollector-latest-setup.exe"

            - name: Zip (Self-Contained)
              run: Compress-Archive -Path publish/self-contained/* -DestinationPath StreamDropCollector-${{ github.ref_name }}-self-contained.zip

            - name: Zip (Framework-Dependent)
              run: Compress-Archive -Path publish/framework-dependent/* -DestinationPath StreamDropCollector-${{ github.ref_name }}-framework-dependent.zip

            - name: Copy under a fixed "latest" filename
              shell: pwsh
              run: |
                  # Same content as the versioned zips above, just under a filename that never changes -
                  # so "…/releases/latest/download/StreamDropCollector-latest-self-contained.zip" is a
                  # permanent link that always serves whatever's newest, without anyone needing to know
                  # (or update) a version number.
                  Copy-Item "StreamDropCollector-${{ github.ref_name }}-self-contained.zip" "StreamDropCollector-latest-self-contained.zip"
                  Copy-Item "StreamDropCollector-${{ github.ref_name }}-framework-dependent.zip" "StreamDropCollector-latest-framework-dependent.zip"

            - name: Publish SHA256 to updateInfo.sdc
              shell: pwsh
              run: |
                  # The self-updater verifies this hash before extracting/running a downloaded update, as
                  # defense-in-depth beyond plain HTTPS. Published here so it lives alongside the version the
                  # maintainer already set in updateInfo.sdc for this release.
                  $hash = (Get-FileHash "StreamDropCollector-${{ github.ref_name }}-self-contained.zip" -Algorithm SHA256).Hash.ToLower()

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin master
                  git checkout master

                  $json = Get-Content updateInfo.sdc -Raw | ConvertFrom-Json
                  $json | Add-Member -NotePropertyName sha256 -NotePropertyValue $hash -Force
                  ($json | ConvertTo-Json -Depth 10) | Set-Content updateInfo.sdc -Encoding utf8

                  git add updateInfo.sdc
                  git commit -m "chore: publish sha256 for ${{ github.ref_name }} [skip ci]"
                  git push origin master

            - name: Get previous tag
              id: prev_tag
              shell: pwsh
              run: |
                  $prev = git tag --sort=-creatordate | Where-Object { $_ -ne "${{ github.ref_name }}" -and $_ -ne "nightly" } | Select-Object -First 1
                  echo "tag=$prev" >> $env:GITHUB_OUTPUT

            - name: Create release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $notes = @"
                  An installer (recommended) and portable self-contained/framework-dependent builds are all attached below.

                  **Permanent download links** (always point at the newest release, no version number needed):
                  - [Installer (recommended)](https://github.com/Scuttle-ZapAccess/StreamDropCollector/releases/latest/download/StreamDropCollector-latest-setup.exe)
                  - [Self-contained portable](https://github.com/Scuttle-ZapAccess/StreamDropCollector/releases/latest/download/StreamDropCollector-latest-self-contained.zip)
                  - [Framework-dependent portable](https://github.com/Scuttle-ZapAccess/StreamDropCollector/releases/latest/download/StreamDropCollector-latest-framework-dependent.zip)

                  [Installation guide](https://github.com/Scuttle-ZapAccess/StreamDropCollector?tab=readme-ov-file#quick-start)

                  Create an issue on GitHub with any feedback or bugs.

                  **Full Changelog**: https://github.com/Scuttle-ZapAccess/StreamDropCollector/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.ref_name }}
                  "@
                  gh release create "${{ github.ref_name }}" `
                    "StreamDropCollector-${{ github.ref_name }}-setup.exe" `
                    "StreamDropCollector-${{ github.ref_name }}-self-contained.zip" `
                    "StreamDropCollector-${{ github.ref_name }}-framework-dependent.zip" `
                    "StreamDropCollector-latest-setup.exe" `
                    "StreamDropCollector-latest-self-contained.zip" `
                    "StreamDropCollector-latest-framework-dependent.zip" `
                    --title "StreamDropCollector ${{ github.ref_name }}" `
                    --verify-tag `
                    --notes $notes
