name: Release Build
on:
    push:
        tags: ["v*"]
jobs:
    build:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Publish (Self-Contained)
              run: |
                  Remove-Item -Recurse -Force publish/self-contained/ -ErrorAction SilentlyContinue
                  dotnet publish UI/UI.csproj -c Release -r win-x64 -p:SelfContained=true -o publish/self-contained/

            - name: Publish (Framework-Dependent)
              run: |
                  Remove-Item -Recurse -Force publish/framework-dependent/ -ErrorAction SilentlyContinue
                  dotnet publish UI/UI.csproj -c Release -r win-x64 -p:SelfContained=false -o publish/framework-dependent/

            - name: Build Installer (Inno Setup)
              shell: pwsh
              run: |
                  choco install innosetup -y --no-progress
                  $version = "${{ github.ref_name }}" -replace '^v', ''
                  & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "Installer\StreamDropCollector.iss" "/DMyAppVersion=$version"
                  Copy-Item "publish\installer\StreamDropCollectorSetup-$version.exe" "StreamDropCollector-latest-setup.exe"

            - name: Zip (Self-Contained)
              run: Compress-Archive -Path publish/self-contained/* -DestinationPath StreamDropCollector-latest-self-contained.zip

            - name: Zip (Framework-Dependent)
              run: Compress-Archive -Path publish/framework-dependent/* -DestinationPath StreamDropCollector-latest-framework-dependent.zip

            - name: Publish SHA256 to updateInfo.sdc
              shell: pwsh
              run: |
                  # The self-updater verifies this hash before extracting/running a downloaded update, as
                  # defense-in-depth beyond plain HTTPS. Published here so it lives alongside the version the
                  # maintainer already set in updateInfo.sdc for this release.
                  $hash = (Get-FileHash "StreamDropCollector-latest-self-contained.zip" -Algorithm SHA256).Hash.ToLower()

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin master
                  git checkout master

                  $json = Get-Content updateInfo.sdc -Raw | ConvertFrom-Json
                  $json | Add-Member -NotePropertyName sha256 -NotePropertyValue $hash -Force
                  ($json | ConvertTo-Json -Depth 10) | Set-Content updateInfo.sdc -Encoding utf8

                  git add updateInfo.sdc
                  git commit -m "chore: publish sha256 for ${{ github.ref_name }} [skip ci]"
                  git push origin master

            - name: Get previous tag
              id: prev_tag
              shell: pwsh
              run: |
                  $prev = git tag --sort=-creatordate | Where-Object { $_ -ne "${{ github.ref_name }}" -and $_ -ne "nightly" } | Select-Object -First 1
                  echo "tag=$prev" >> $env:GITHUB_OUTPUT

            - name: Create release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # updateInfo.sdc's "changelog" array is the maintainer-written bullet list for this
                  # release - this is the ONE place it's authored; both the GitHub release body and the
                  # in-app "Check for Updates" changelog read from it, so keep this format (a bullet list,
                  # "### Changelog" heading) stable - it's relied on by both.
                  $changelogItems = (Get-Content updateInfo.sdc -Raw | ConvertFrom-Json).changelog
                  $changelog = ($changelogItems | ForEach-Object { "- $_" }) -join "`n"

                  $notes = @"
                  An installer (recommended) and portable self-contained/framework-dependent builds are all attached below.

                  **Permanent download links** (always point at the newest release, no version number needed):
                  - [Installer (recommended)](https://github.com/ScuttleK/StreamDropCollector/releases/latest/download/StreamDropCollector-latest-setup.exe)
                  - [Self-contained portable](https://github.com/ScuttleK/StreamDropCollector/releases/latest/download/StreamDropCollector-latest-self-contained.zip)
                  - [Framework-dependent portable](https://github.com/ScuttleK/StreamDropCollector/releases/latest/download/StreamDropCollector-latest-framework-dependent.zip)

                  [Installation guide](https://github.com/ScuttleK/StreamDropCollector?tab=readme-ov-file#quick-start)

                  **About the Windows SmartScreen warning:** this is free, unsigned open-source software, so Windows will likely show a "Windows protected your PC / Unknown publisher" warning the first time you run it - this is standard for small/indie software, not a sign of anything malicious. Click More info -> Run anyway. Source is public here if you want to verify it yourself.

                  Create an issue on GitHub with any feedback or bugs.

                  ### Changelog
                  $changelog

                  **Full Changelog**: https://github.com/ScuttleK/StreamDropCollector/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.ref_name }}
                  "@
                  # Only the fixed "latest" filenames are attached - people should always grab the
                  # newest build, not a version-pinned one, so there's no per-version installer/zip
                  # clutter across releases.
                  gh release create "${{ github.ref_name }}" `
                    "StreamDropCollector-latest-setup.exe" `
                    "StreamDropCollector-latest-self-contained.zip" `
                    "StreamDropCollector-latest-framework-dependent.zip" `
                    --title "StreamDropCollector ${{ github.ref_name }}" `
                    --verify-tag `
                    --notes $notes
